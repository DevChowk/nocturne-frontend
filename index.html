<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bumpp | Meet people, instantly</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <script>
      // Pre-hydration theme bootstrap. SettingsProvider takes over on mount,
      // but React needs a tick to render — without this, the initial paint
      // would flash the wrong theme (default light) for OS-dark users who've
      // picked "system", or for anyone who chose light/dark last session.
      // Reads the same key SettingsProvider uses and stamps <html> before
      // the first paint, then the provider silently reconciles.
      (function () {
        try {
          var raw = localStorage.getItem('bumpSettings');
          var pref = raw ? (JSON.parse(raw).theme || 'system') : 'system';
          var root = document.documentElement;
          if (pref === 'light') { root.setAttribute('data-theme', 'light'); }
          else if (pref === 'dark') { root.setAttribute('data-theme', 'dark'); root.classList.add('dark'); }
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            root.classList.add('dark');
          }
        } catch (_) { /* private mode / malformed json — SettingsProvider will reconcile */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
