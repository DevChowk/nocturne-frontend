<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bumpp | Meet people, instantly</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <script>
      // Pre-hydration theme bootstrap. SettingsProvider takes over on mount,
      // but React needs a tick to render — without this, the initial paint
      // would flash the wrong theme for anyone who chose dark, or who is on
      // "system" with an OS-dark machine. Reads the same key SettingsProvider
      // uses (including its v2 'system' → 'light' migration, so the first
      // paint agrees with what the provider is about to settle on) and stamps
      // <html> before the first paint.
      (function () {
        var root = document.documentElement;
        var pref = 'light'; // product default — Sunbaked
        try {
          var raw = localStorage.getItem('bumpSettings');
          if (raw) {
            var stored = JSON.parse(raw);
            pref = stored.theme || 'light';
            if (pref === 'system' && (stored.v || 1) < 2) pref = 'light';
          }
        } catch (_) { /* private mode / malformed json — SettingsProvider will reconcile */ }
        if (pref === 'dark') { root.setAttribute('data-theme', 'dark'); root.classList.add('dark'); }
        else if (pref === 'system') {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            root.classList.add('dark');
          }
        } else { root.setAttribute('data-theme', 'light'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
